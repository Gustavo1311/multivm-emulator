org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# Como compilar o codigo nativo (libmultivm.so):
#   auto     - usa CMake/NDK se houver NDK; senao usa src/main/jniLibs pre-compilado
#   cmake    - sempre CMake/NDK
#   prebuilt - sempre src/main/jniLibs (gerado por build-native.sh)
multivm.nativeBuild=auto
