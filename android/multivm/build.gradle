plugins {
    id 'com.android.library'
}

// --- escolha do modo de compilacao nativa -------------------------------
def localProps = new Properties()
def lp = rootProject.file('local.properties')
if (lp.exists()) lp.withInputStream { localProps.load(it) }
def sdkDir = localProps.getProperty('sdk.dir') ?: System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
def hasNdk = localProps.getProperty('ndk.dir') || System.getenv('ANDROID_NDK_HOME') || System.getenv('ANDROID_NDK_ROOT') ||
        (sdkDir && new File(sdkDir, 'ndk').isDirectory())
def hasPrebuilt = file('src/main/jniLibs/arm64-v8a/libmultivm.so').exists()
def mode = (project.findProperty('multivm.nativeBuild') ?: 'auto').toString()
def useCmake = mode == 'cmake' || (mode == 'auto' && (hasNdk || !hasPrebuilt))
logger.lifecycle("MultiVM: codigo nativo via ${useCmake ? 'CMake/NDK' : 'jniLibs pre-compilado'}")

android {
    namespace 'com.multivm.core'
    compileSdk 34
    buildToolsVersion '34.0.3'

    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
        if (useCmake) {
            externalNativeBuild {
                cmake {
                    arguments '-DANDROID_STL=none'
                    cFlags '-O3'
                }
            }
            ndk {
                // O nucleo usa __int128: apenas ABIs de 64 bits.
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    if (useCmake) {
        externalNativeBuild {
            cmake {
                path 'src/main/cpp/CMakeLists.txt'
                version '3.22.1'
            }
        }
    } else {
        sourceSets.main.jniLibs.srcDirs = ['src/main/jniLibs']
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
